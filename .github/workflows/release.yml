name: Release

# Push a tag X.Y.Z on main to release. The tag must equal "version" in
# platform.json. Users pin a release with
#   platform = https://github.com/KORLINX/KORLINX-PlatformIO.git#X.Y.Z

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("platform.json"))["version"])')
          [ "$version" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match platform.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
          # every package fetched by URL must come from a KORLINX release
          python3 - <<'EOF'
          import json, sys
          for name, pkg in json.load(open("platform.json"))["packages"].items():
              url = pkg["version"]
              if "://" in url and not url.startswith("https://github.com/KORLINX/"):
                  sys.exit("::error::%s must come from a KORLINX release, not %s" % (name, url))
          EOF
          core=$(python3 -c 'import json; p=json.load(open("platform.json"))["packages"]; print(" and ".join(p[n]["version"] for n in ("framework-arduino-korlinx-nrf52", "framework-arduino-korlinx-zephyr")))')
          echo "CORE=$core" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "Use it with \`platform = https://github.com/KORLINX/KORLINX-PlatformIO.git#$GITHUB_REF_NAME\`. Arduino cores: $CORE"
