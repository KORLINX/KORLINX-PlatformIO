name: Bump core

# Moves platform.json to a released KORLINX-nRF52-Arduino archive and opens a
# pull request. The core's release workflow dispatches this; it can also be
# run by hand from the Actions tab.
#
# Needs "Allow GitHub Actions to create and approve pull requests" enabled in
# the repository settings (Settings > Actions > General).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Core version, e.g. 1.0.2 (the release tag is v<version>)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the release archive and point platform.json at it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not X.Y.Z: $VERSION"; exit 1; }
          # .tar.gz, not .tar.bz2: PlatformIO takes a github.com URL that does not end
          # in .zip, .tar.gz or .tar.xz for a git repository and tries to clone it.
          name="KXduino_nRF52-$VERSION.tar.gz"
          url="https://github.com/KORLINX/KORLINX-nRF52-Arduino/releases/download/v$VERSION/$name"
          curl -fsSL -o "$RUNNER_TEMP/$name" "$url"
          # The archive must carry the PlatformIO manifest for this version.
          tar -xzOf "$RUNNER_TEMP/$name" "KXduino_nRF52-$VERSION/package.json" > "$RUNNER_TEMP/package.json"
          python3 - "$RUNNER_TEMP/package.json" "$VERSION" "$url" <<'EOF'
          import json, sys
          manifest, version, url = sys.argv[1], sys.argv[2], sys.argv[3]
          pkg = json.load(open(manifest))
          assert pkg["name"] == "framework-arduino-korlinx-nrf52", pkg["name"]
          assert pkg["version"] == version, (pkg["version"], version)
          platform = json.load(open("platform.json"))
          platform["packages"]["framework-arduino-korlinx-nrf52"]["version"] = url
          with open("platform.json", "w") as fp:
              fp.write(json.dumps(platform, indent=2) + "\n")
          EOF
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet platform.json; then
            echo "platform.json already uses core $VERSION"; exit 0
          fi
          branch="bump-core-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Use KORLINX nRF52 core $VERSION"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Use KORLINX nRF52 core $VERSION" \
            --body "Points \`framework-arduino-korlinx-nrf52\` at the [v$VERSION core release](https://github.com/KORLINX/KORLINX-nRF52-Arduino/releases/tag/v$VERSION). The Examples workflow builds every example with it. After merging, bump \`version\` in platform.json and push a matching tag to release the platform."
